function LoginOverlay({onLogin, onCancel}) {
  const [loginField, setLoginField] = useState("");
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [err, setErr] = useState("");
  const tryLogin = async () => {
    // 1. Verifica senha master
    const stored = await load(K.password, DEFAULT_PW);
    if (pw === stored) { onLogin({role:"master",name:"Master"}); return; }
    // 2. Verifica usuários cadastrados (por login+senha ou só senha)
    const allUsers = listOrEmpty(await load(K.users, []));
    // Tenta match por: campo login como usuário, ou só senha
    const matched = allUsers.find(u => u.active && (
      (loginField && u.login === loginField && u.password === pw) ||
      (!loginField && u.password === pw)
    ));
    if (matched) { onLogin({role:"user", name:matched.name, login:matched.login, tabs:matched.tabs||[]}); return; }
    setErr("Login ou senha incorretos."); setPw("");
  };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000,fontFamily:"'Barlow',sans-serif"}}>
      <div style={{background:C.navyM,border:"1px solid "+C.border,borderRadius:16,padding:"40px 44px",width:"100%",maxWidth:380,textAlign:"center",position:"relative"}}>
        {onCancel&&<button onClick={onCancel} style={{position:"absolute",top:14,right:14,background:"none",border:"none",cursor:"pointer",color:C.muted}}><Icon d={IC.x} size={18}/></button>}
        <img src={LOGO} alt="Meca" style={{width:76,height:76,objectFit:"cover",borderRadius:12,marginBottom:18}}/>
        <div style={{fontSize:26,fontWeight:900,color:C.orange,letterSpacing:-1,marginBottom:4}}>meca</div>
        <div style={{fontSize:11,color:C.blueL,letterSpacing:3,textTransform:"uppercase",marginBottom:26}}>Laundry Solutions</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:18}}>Digite a senha master para acessar</div>
        {err&&<div style={{padding:"8px 14px",borderRadius:7,fontSize:13,fontWeight:600,marginBottom:14,background:"rgba(192,57,43,0.15)",color:"#e74c3c"}}>{err}</div>}
        <div style={{marginBottom:10}}>
          <input type="text" placeholder="Login (deixe em branco para master)" value={loginField}
            onChange={e=>{setLoginField(e.target.value);setErr("");}}
            onKeyDown={e=>e.key==="Enter"&&tryLogin()}
            style={{...inp,fontSize:14}} autoFocus/>
        </div>
        <div style={{position:"relative",marginBottom:14}}>
          <input type={show?"text":"password"} placeholder="Senha" value={pw}
            onChange={e=>{setPw(e.target.value);setErr("");}}
            onKeyDown={e=>e.key==="Enter"&&tryLogin()}
            style={{...inp,paddingRight:44,fontSize:15,letterSpacing:2}}/>
          <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.muted}}><Icon d={IC.eye} size={16}/></button>
        </div>
        <button style={{...btn("primary"),width:"100%",justifyContent:"center",padding:"12px",fontSize:15}} onClick={tryLogin}><Icon d={IC.lock} size={16}/>Entrar</button>
      </div>
    </div>
  );
}

function ChangePwModal({onClose}) {
  const [cur, setCur] = useState(""); const [nw, setNw] = useState(""); const [conf, setConf] = useState("");
  const [err, setErr] = useState(""); const [ok, setOk] = useState(false);
  const doSave = async () => {
    const stored = await load(K.password, DEFAULT_PW);
    if (cur!==stored){setErr("Senha atual incorreta.");return;}
    if (nw.length<6){setErr("Mínimo 6 caracteres.");return;}
    if (nw!==conf){setErr("Senhas não coincidem.");return;}
    await save(K.password, nw); setOk(true); setTimeout(onClose, 1500);
  };
  return <Modal title="Alterar Senha" onClose={onClose} maxWidth={400}>
    {ok?<div style={{textAlign:"center",padding:"20px 0",color:"#2ecc71",fontWeight:700}}>✓ Senha alterada!</div>
      :<div style={{display:"flex",flexDirection:"column",gap:14}}>
        {err&&<div style={{padding:"8px 14px",borderRadius:7,fontSize:13,fontWeight:600,background:"rgba(192,57,43,0.15)",color:"#e74c3c"}}>{err}</div>}
        <div style={fld}><label style={lbl}>Senha Atual</label><input type="password" style={inp} value={cur} onChange={e=>{setCur(e.target.value);setErr("");}}/></div>
        <div style={fld}><label style={lbl}>Nova Senha</label><input type="password" style={inp} value={nw} onChange={e=>{setNw(e.target.value);setErr("");}}/></div>
        <div style={fld}><label style={lbl}>Confirmar</label><input type="password" style={inp} value={conf} onChange={e=>{setConf(e.target.value);setErr("");}}/></div>
        <div style={{...row,justifyContent:"flex-end",gap:10}}>
          <button style={btn("ghost")} onClick={onClose}>Cancelar</button>
          <button style={btn("primary")} onClick={doSave}><Icon d={IC.key} size={15}/>Salvar</button>
        </div>
      </div>}
  </Modal>;
}

// ═══════════════════════════════════════════════════════════════
// ROOT APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [authed, setAuthed]   = useState(false);
  const [currentUser, setCurrentUser] = useState(null);
  const [showLogin, setLogin] = useState(false);
  const [pendingTab, setPendingTab] = useState(null);
  const [changePw, setChangePw] = useState(false);
  const [tab, setTab]         = useState("laudo");
  const [loading, setLoading] = useState(true);

  const [clients,  setClientsRaw]  = useState([]);
  const [services, setServicesRaw] = useState(SEED);
  const [quotes,   setQuotesRaw]   = useState([]);
  const [schedule, setScheduleRaw] = useState([]);
  const [laudos,   setLaudosRaw]   = useState([]);
  const [tecnicos, setTecnicosRaw] = useState([]);
  const [users, setUsersRaw] = useState([]);
  const [manuals,  setManualsRaw]  = useState([]);

  const dirty = useRef({});

  // ── FIX: makeSetter sem useCallback (não é hook, está fora de componente React) ──
  function makeSetter(key, rawSetter) {
    return function(val) {
      rawSetter(val);
      saveLocal(key, val);
      if (navigator.onLine === false) markPending(key);
      dirty.current[key] = val;
    };
  }

  const setClients  = makeSetter(K.clients,  setClientsRaw);
  const setServices = makeSetter(K.services, setServicesRaw);
  const setQuotes   = makeSetter(K.quotes,   setQuotesRaw);
  const setSchedule = makeSetter(K.schedule, setScheduleRaw);
  const setLaudos   = makeSetter(K.laudos,   setLaudosRaw);
  const setTecnicos = makeSetter(K.tecnicos, setTecnicosRaw);
  const setManuals  = makeSetter(K.manuals,  setManualsRaw);
  const setUsers    = makeSetter(K.users,    setUsersRaw);

  const flush = useCallback(async () => {
    const d = dirty.current;
    dirty.current = {};
    await Promise.all(Object.entries(d).map(([k,v])=>save(k,v)));
  }, []);

  useEffect(() => {
    const handler = () => { if (document.visibilityState === "hidden") flush(); };
    const beforeUnload = () => {
      Object.entries(dirty.current).forEach(([key, value]) => { saveLocal(key, value); markPending(key); });
    };
    document.addEventListener("visibilitychange", handler);
    window.addEventListener("beforeunload", beforeUnload);
    return () => {
      document.removeEventListener("visibilitychange", handler);
      window.removeEventListener("beforeunload", beforeUnload);
    };
  }, [flush]);

  useEffect(() => {
    const t = setInterval(flush, 30000);
    return () => clearInterval(t);
  }, [flush]);

  useEffect(() => {
    const handleOnline = async () => { await flush(); await syncPending(); };
    window.addEventListener("online", handleOnline);
    handleOnline();
    return () => window.removeEventListener("online", handleOnline);
  }, [flush]);

  // Injeta logo na marca d'água
  useEffect(() => {
    const wm = document.getElementById("meca-watermark");
    if (wm) {
      wm.style.backgroundImage = `url('${LOGO}')`;
      wm.style.backgroundSize = "contain";
      wm.style.backgroundRepeat = "no-repeat";
      wm.style.backgroundPosition = "center center";
    }
  }, []);

  useEffect(() => {
    (async () => {
      const [cl,sv,qu,sc,ld,tc,mn,us] = await Promise.all([
        load(K.clients,[]),  load(K.services,null),
        load(K.quotes,[]),   load(K.schedule,[]),
        load(K.laudos,[]),   load(K.tecnicos,[]),
        load(K.users,[]),
        loadManuals(),
      ]);
      setClientsRaw(listOrEmpty(cl));
      const serviceList = listOrEmpty(sv);
      setServicesRaw(serviceList.length>0?serviceList:SEED);
      if (!serviceList.length) await save(K.services,SEED);
      setQuotesRaw(listOrEmpty(qu));
      setScheduleRaw(listOrEmpty(sc));
      setLaudosRaw(listOrEmpty(ld));
      setTecnicosRaw(listOrEmpty(tc));
      setManualsRaw(listOrEmpty(await loadManuals()));
      setUsersRaw(listOrEmpty(us));
      setLoading(false);
    })();

    const unsubs = [
      subscribe(K.clients,   v => setClientsRaw(listOrEmpty(v))),
      subscribe(K.services,  v => { const list = listOrEmpty(v); setServicesRaw(list.length?list:SEED); }),
      subscribe(K.quotes,    v => setQuotesRaw(listOrEmpty(v))),
      subscribe(K.schedule,  v => setScheduleRaw(listOrEmpty(v))),
      subscribe(K.laudos,    v => setLaudosRaw(listOrEmpty(v))),
      subscribe(K.tecnicos,  v => setTecnicosRaw(listOrEmpty(v))),
      subscribe(K.users, v => setUsersRaw(listOrEmpty(v))),
      subscribe(K.manuals, async v => {
        const full = await idbLoadManuals(listOrEmpty(v));
        setManualsRaw(full);
      }),
    ];
    if (!document.getElementById("meca-font")) {
      const l = document.createElement("link");
      l.id="meca-font"; l.rel="stylesheet";
      l.href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap";
      document.head.appendChild(l);
    }
    return () => unsubs.forEach(u=>u());
  }, []);

  function upsert(list, setList, item) {
    const safeList = listOrEmpty(list);
    const next = safeList.find(x=>x.id===item.id) ? safeList.map(x=>x.id===item.id?item:x) : [item,...safeList];
    setList(next);
    let key = null;
    if (setList === setClients) key = K.clients;
    else if (setList === setServices) key = K.services;
    else if (setList === setQuotes) key = K.quotes;
    else if (setList === setSchedule) key = K.schedule;
    else if (setList === setLaudos) key = K.laudos;
    else if (setList === setTecnicos) key = K.tecnicos;
    else if (setList === setManuals) key = K.manuals;
    if (!key) return;
    // Para laudos: salvar só o item alterado (não o array inteiro)
    // Isso é muito mais rápido no celular
    if (key === K.laudos && FB_CONFIGURED && window.DB) {
      saveLocal(key, next);
      saveLaudoFB(item).catch(e => {
        markPending(key);
        console.warn("Laudo FB save erro:", e.message);
      });
    } else {
      save(key, next);
    }
  }

  function remove(list, setList, id) {
    const safeList = listOrEmpty(list);
    const found = safeList.find(x => x.id === id);
    let key = null;
    if (found) {
      if (setList === setClients) key = K.clients;
      else if (setList === setServices) key = K.services;
      else if (setList === setQuotes) key = K.quotes;
      else if (setList === setSchedule) key = K.schedule;
      else if (setList === setLaudos) key = K.laudos;
      else if (setList === setTecnicos) key = K.tecnicos;
      else if (setList === setManuals) key = K.manuals;
      if (key) markDeleted(key, id);
    }
    const next = safeList.filter(x=>x.id!==id);
    setList(next);
    if (!key) return;
    // Para laudos: deletar nó individual no Firebase
    if (key === K.laudos && FB_CONFIGURED && window.DB) {
      saveLocal(key, next);
      window.DB.ref("meca/laudos/" + id).remove().catch(function(){});
    } else {
      save(key, next);
    }
  }

  async function removeClientWithPassword(id) {
    const password = window.prompt("Digite a senha master para excluir este cliente:");
    if (password === null) return false;
    const stored = await load(K.password, DEFAULT_PW);
    if (password !== stored) { window.alert("Senha incorreta. Cliente não excluído."); return false; }
    remove(clients, setClients, id);
    return true;
  }

  const TABS = [
    {id:"laudo",      label:"Laudo Técnico",                icon:IC.camera,   free:true},
    {id:"calendario", label:"Calendário",                   icon:IC.calendar, free:false},
    {id:"controle",   label:"Controle",                     icon:IC.list,     free:false},
    {id:"agendamento",label:"Agendamento",                  icon:IC.calendar, free:false},
    {id:"orcamento",  label:"Orçamento",                    icon:IC.quote,    free:false},
    {id:"servicos",   label:`Serviços (${services.length})`,icon:IC.wrench,   free:false},
    {id:"clientes",   label:`Clientes (${clients.length})`, icon:IC.users,    free:true},
    {id:"manuais",    label:`Manuais (${manuals.length})`,  icon:IC.folder,   free:true},
    {id:"tecnicos",   label:`Técnicos (${tecnicos.length})`,icon:IC.user,     free:false},
    {id:"usuarios",   label:`Usuários (${users.length})`,   icon:IC.shield,   free:false},
  ];

  const canAccessForUser = (t, user) => {
    if (!t) return false;
    if (!user) return t.free; // não logado: só abas free
    if (user.role === "master") return true; // master: tudo
    // usuário comum: verifica tabs permitidas
    return (user.tabs || []).includes(t.id);
  };
  const isMaster = currentUser && currentUser.role === "master";
  const canAccess = t => canAccessForUser(t, currentUser);

  const closeLogin = () => { setLogin(false); setPendingTab(null); };
  const goTab = t => {
    if (canAccess(t)) { setTab(t.id); return; }
    setPendingTab(t.id); setLogin(true);
  };
  const onLogin = user => {
    setCurrentUser(user); setAuthed(true); setLogin(false);
    const requested = TABS.find(t => t.id === pendingTab);
    const requestedAllowed = requested && canAccessForUser(requested, user);
    const first = requestedAllowed ? requested : user&&user.role==="master" ? TABS.find(t=>t.id==="laudo") : TABS.find(t=>canAccessForUser(t,user)&&!t.free);
    setPendingTab(null); setTab((first&&first.id)||"laudo");
  };

  useEffect(() => {
    const current = TABS.find(t => t.id === tab);
    if (current && !canAccess(current)) setTab("laudo");
  }, [tab, currentUser, authed]);

  if (loading) return (
    <div style={{minHeight:"100vh",background:C.navy,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,fontFamily:"'Barlow',sans-serif",padding:24}}>
      <img src={LOGO} alt="Meca" style={{width:76,height:76,objectFit:"cover",borderRadius:12}}/>
      <div style={{color:C.orange,fontWeight:700,fontSize:16}}>Carregando…</div>
      {!FB_CONFIGURED && <div style={{background:"rgba(232,103,10,0.1)",border:"1px solid "+C.orange,borderRadius:12,padding:20,maxWidth:480,width:"100%",marginTop:8}}>
        <div style={{color:C.orange,fontWeight:800,fontSize:15,marginBottom:10}}>⚙️ Firebase não configurado</div>
        <div style={{color:C.text,fontSize:13,lineHeight:1.7}}>
          Os dados estão sendo salvos apenas neste navegador. Para compartilhar com todos:<br/><br/>
          1. Acesse <strong style={{color:C.blueL}}>console.firebase.google.com</strong><br/>
          2. Crie um projeto (grátis) → adicione um app Web<br/>
          3. Copie as credenciais e cole no início do HTML<br/>
          4. No console Firebase, vá em Realtime Database → Criar banco → modo teste<br/>
          5. Republique o arquivo HTML
        </div>
      </div>}
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:C.navy,fontFamily:"'Barlow',sans-serif",color:C.text}}>
      {showLogin&&<LoginOverlay onLogin={onLogin} onCancel={closeLogin}/>}
      {changePw&&<ChangePwModal onClose={()=>setChangePw(false)}/>}

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0f1f38,#0d1929)",borderBottom:"2px solid "+C.orange,padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:62,boxShadow:"0 4px 24px rgba(0,0,0,0.4)"}}>
        <img src={LOGO} alt="Meca" style={{height:50,width:50,objectFit:"cover",borderRadius:8,flexShrink:0}}/>
        {FB_CONFIGURED
          ? <span style={{fontSize:11,color:"#2ecc71",background:"rgba(46,204,113,0.12)",border:"1px solid #2ecc7133",borderRadius:20,padding:"2px 10px",flexShrink:0}}>● Sincronizado</span>
          : <span style={{fontSize:11,color:"#f39c12",background:"rgba(243,156,18,0.12)",border:"1px solid #f39c1233",borderRadius:20,padding:"2px 10px",flexShrink:0}}>⚠ Local</span>
        }
        <div style={row}>
          {authed&&<span style={{fontSize:12,color:C.muted}}>{isMaster?"Master":(currentUser&&currentUser.name)||(currentUser&&currentUser.login)}</span>}
          {isMaster&&<button style={{...btn("ghost"),fontSize:12,padding:"6px 12px"}} onClick={()=>setChangePw(true)}><Icon d={IC.key} size={13}/>Alterar Senha</button>}
          {authed&&<button style={{...btn("ghost"),fontSize:12,padding:"6px 12px"}} onClick={async()=>{await flush();setAuthed(false);setCurrentUser(null);setPendingTab(null);setTab("laudo");}}><Icon d={IC.lock} size={13}/>Sair</button>}
          {!authed&&<button style={{...btn("primary"),fontSize:12,padding:"6px 14px"}} onClick={()=>setLogin(true)}><Icon d={IC.lock} size={13}/>Entrar</button>}
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",gap:4,padding:"14px 20px 0",borderBottom:"1px solid "+C.border,flexWrap:"wrap",overflowX:"auto"}}>
        {TABS.map(t=>{
          const active=tab===t.id, locked=!canAccess(t);
          return <button key={t.id} onClick={()=>goTab(t)}
            style={{display:"flex",alignItems:"center",gap:6,padding:"9px 16px",borderRadius:"8px 8px 0 0",
              border:"none",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit",
              background:active?C.orange:C.navyM,color:active?"#fff":locked?"#3a5275":C.muted,
              borderBottom:active?"2px solid "+C.orange:"2px solid transparent",opacity:locked?0.7:1,
              flexShrink:0}}>
            <Icon d={t.icon} size={14}/>{t.label}{locked&&<Icon d={IC.lock} size={11}/>}
          </button>;
        })}
      </div>

      {/* Content */}
      <div style={{padding:20,maxWidth:1100,margin:"0 auto"}}>
        {tab==="laudo"&&<TabLaudo clients={clients} tecnicos={tecnicos} data={laudos}
          onSave={l=>upsert(laudos,setLaudos,l)} onDelete={id=>remove(laudos,setLaudos,id)}
          authed={authed} onLoginNeeded={()=>setLogin(true)}/>}

        {tab==="calendario"&&canAccess(TABS.find(t=>t.id==="calendario"))&&
          <TabCalendario schedule={schedule} currentUser={currentUser}
            isMaster={isMaster} clients={clients}/>}

        {tab==="controle"&&canAccess(TABS.find(t=>t.id==="controle"))&&
          <TabControle laudos={laudos} quotes={quotes} schedule={schedule}/>}

        {tab==="agendamento"&&canAccess(TABS.find(t=>t.id==="agendamento"))&&
          <TabAgendamento clients={clients} tecnicos={tecnicos} data={schedule}
            onSave={a=>upsert(schedule,setSchedule,a)} onDelete={id=>remove(schedule,setSchedule,id)}
            onChange={(id,a)=>{const next=schedule.map(x=>x.id===id?a:x);setScheduleRaw(next);save(K.schedule,next);}}
            authed={authed} onLoginNeeded={()=>setLogin(true)}/>}

        {tab==="orcamento"&&canAccess(TABS.find(t=>t.id==="orcamento"))&&
          <TabOrcamento clients={clients} services={services} data={quotes}
            onSave={q=>upsert(quotes,setQuotes,q)}
            onDelete={id=>remove(quotes,setQuotes,id)}
            authed={authed} onLoginNeeded={()=>setLogin(true)}/>}

        {tab==="servicos"&&canAccess(TABS.find(t=>t.id==="servicos"))&&
          <TabServicos data={services}
            onSave={s=>upsert(services,setServices,s)} onDelete={id=>remove(services,setServices,id)}/>}

        {tab==="clientes"&&<TabClientes data={clients}
          onSave={c=>upsert(clients,setClients,c)} onDelete={removeClientWithPassword}/>}

        {tab==="manuais"&&<TabManuais data={manuals} isMaster={isMaster}
          onSaveFolder={async m=>{
            const next = manuals.find(x=>x.id===m.id) ? manuals.map(x=>x.id===m.id?m:x) : [m,...manuals];
            setManualsRaw(next);
            await saveManuals(next);
          }}
          onDeleteFolder={async id=>{
            const next = manuals.filter(x=>x.id!==id);
            setManualsRaw(next);
            await saveManuals(next);
          }}/>}

        {tab==="tecnicos"&&canAccess(TABS.find(t=>t.id==="tecnicos"))&&
          <TabTecnicos data={tecnicos}
            onSave={t=>upsert(tecnicos,setTecnicos,t)}
            onDelete={id=>remove(tecnicos,setTecnicos,id)}
            onToggle={id=>{const next=tecnicos.map(t=>t.id===id?{...t,active:!t.active}:t);setTecnicosRaw(next);save(K.tecnicos,next);}}/>}

        {tab==="usuarios"&&canAccess(TABS.find(t=>t.id==="usuarios"))&&
          <TabUsuarios data={users}
            onSave={u=>upsert(users,setUsers,u)}
            onDelete={id=>remove(users,setUsers,id)}/>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

    (function() {
      var logo = window.MECA_LOGO;
      if (!logo) return;
      // Marca d'água: background-image no div
      var wm = document.getElementById('meca-watermark');
      if (wm) {
        wm.style.backgroundImage = "url('" + logo + "')";
        wm.style.backgroundSize = "contain";
        wm.style.backgroundRepeat = "no-repeat";
        wm.style.backgroundPosition = "center center";
      }
    })();
    document.addEventListener('DOMContentLoaded', function() {
      var logo = window.MECA_LOGO;
      if (!logo) return;
      var wm = document.getElementById('meca-watermark');
      if (wm) {
        wm.style.backgroundImage = "url('" + logo + "')";
        wm.style.backgroundSize = "contain";
        wm.style.backgroundRepeat = "no-repeat";
        wm.style.backgroundPosition = "center center";
      }
    });
  </script>
