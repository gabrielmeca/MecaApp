  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const K = {
  clients:"meca/clients", services:"meca/services", quotes:"meca/quotes",
  schedule:"meca/schedule", laudos:"meca/laudos", tecnicos:"meca/tecnicos",
  manuals:"meca/manuals", password:"meca/password", users:"meca/users"
};

const FB_CONFIGURED = window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey !== "COLE_AQUI";
const PENDING_SYNC_KEY = "meca/pendingSync";
const DELETED_SYNC_KEY = "meca/deletedRecords";

function localKey(key) { return "meca_local_" + key.replace(/\W+/g, "_"); }
function getPendingKeys() {
  try { return JSON.parse(localStorage.getItem(PENDING_SYNC_KEY) || "[]"); } catch(_e) { return []; }
}
function setPendingKeys(keys) {
  try { localStorage.setItem(PENDING_SYNC_KEY, JSON.stringify([...new Set(keys)])); } catch(_e) {}
}
function markPending(key) { setPendingKeys([...getPendingKeys(), key]); }
function unmarkPending(key) { setPendingKeys(getPendingKeys().filter(k => k !== key)); }
function getDeletedRecords() {
  try { return JSON.parse(localStorage.getItem(DELETED_SYNC_KEY) || "{}"); } catch(_e) { return {}; }
}
function setDeletedRecords(data) {
  try { localStorage.setItem(DELETED_SYNC_KEY, JSON.stringify(data)); } catch(_e) {}
}
function getDeletedIds(key) {
  const data = getDeletedRecords();
  return Array.isArray(data[key]) ? data[key] : [];
}
function markDeleted(key, id) {
  const data = getDeletedRecords();
  data[key] = [...new Set([...(data[key] || []), id])];
  setDeletedRecords(data);
  markPending(key);
}
function clearDeletedIds(key, ids) {
  if (!ids.length) return;
  const data = getDeletedRecords();
  data[key] = (data[key] || []).filter(id => !ids.includes(id));
  if (!data[key].length) delete data[key];
  setDeletedRecords(data);
}
function saveLocal(key, value) {
  try {
    localStorage.setItem(localKey(key), JSON.stringify(value));
  } catch(_e) {
    // localStorage cheio: tentar salvar sem fotos nos laudos
    if (key === "meca/laudos" && Array.isArray(value)) {
      try {
        const semFotos = value.map(l => {
          const c = Object.assign({}, l);
          c._hasPhotos = !!(l.photos && l.photos.length);
          delete c.photos;
          return c;
        });
        localStorage.setItem(localKey(key), JSON.stringify(semFotos));
        // Salvar fotos no IDB como backup
        savePhotosIDB(value).catch(function(){});
      } catch(_e2) { console.warn("saveLocal laudos fallback:", _e2.message); }
    } else {
      console.warn("saveLocal erro:", _e.message);
    }
  }
}

// IndexedDB para fotos dos laudos
// IDB unificado: "meca_v3" com stores "fotos" (laudos) e "manuals_data"
function openMecaIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("meca_v3", 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("fotos")) db.createObjectStore("fotos");
      if (!db.objectStoreNames.contains("manuals_data")) db.createObjectStore("manuals_data", {keyPath:"id"});
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function savePhotosIDB(laudos) {
  try {
    const db = await openMecaIDB();
    const tx = db.transaction("fotos", "readwrite");
    const st = tx.objectStore("fotos");
    laudos.forEach(l => {
      if (l.photos && l.photos.length > 0) st.put(l.photos, l.id);
    });
    await new Promise((res2, rej2) => { tx.oncomplete = res2; tx.onerror = rej2; });
  } catch(_e) { console.warn("IDB save fotos:", _e.message); }
}
async function loadPhotosIDB(laudos) {
  if (!laudos || !laudos.length) return laudos;
  const semFotos = laudos.filter(l => l._hasPhotos && (!l.photos || !l.photos.length));
  if (!semFotos.length) return laudos;
  try {
    const db = await openMecaIDB();
    const photoMap = {};
    await Promise.all(semFotos.map(l => new Promise(res => {
      const req = db.transaction("fotos").objectStore("fotos").get(l.id);
      req.onsuccess = e => { if (e.target.result) photoMap[l.id] = e.target.result; res(); };
      req.onerror   = () => res();
    })));
    return laudos.map(l => photoMap[l.id] ? Object.assign({}, l, {photos: photoMap[l.id]}) : l);
  } catch(_e) { return laudos; }
}
function legacyLocalKeys(key) {
  const last = key.split("/").pop();
  return [last, key.replace(/\W+/g, "_")];
}
function loadLocal(key, fallback) {
  try {
    const v = localStorage.getItem(localKey(key));
    if (v !== null) return JSON.parse(v);
  } catch(_e) {}
  for (const oldKey of legacyLocalKeys(key)) {
    try {
      const v = localStorage.getItem(oldKey);
      if (v !== null) {
        const parsed = JSON.parse(v);
        saveLocal(key, parsed);
        markPending(key);
        return parsed;
      }
    } catch(_e) {}
  }
  return fallback;
}
function toRecordList(value) {
  if (Array.isArray(value)) return value.filter(item => item && typeof item === "object" && "id" in item);
  if (value && typeof value === "object") {
    const values = Object.values(value);
    if (!values.length) return [];
    const records = values.filter(item => item && typeof item === "object" && "id" in item);
    return records.length ? records : null;
  }
  return null;
}
function listOrEmpty(value) {
  return toRecordList(value) || [];
}
function isRecordList(value) {
  return !!toRecordList(value);
}
function mergeRecordLists(localValue, remoteValue) {
  const localList = toRecordList(localValue);
  const remoteList = toRecordList(remoteValue);
  if (!localList) return localValue;
  if (!remoteList) return localList;
  const map = new Map(remoteList.map(item => [item.id, item]));
  localList.forEach(item => map.set(item.id, item));
  return Array.from(map.values());
}
// Salvar laudo individual no Firebase (evita limite 10MB do array)
async function saveLaudoFB(laudo) {
  if (!window.DB) return;
  // Cada laudo vai em meca/laudos/{id} — máx ~400KB com 8 fotos comprimidas
  await window.DB.ref("meca/laudos/" + laudo.id).set(laudo);
}

async function saveRemote(key, value) {
  if (isRecordList(value)) {
    if (key === "meca/laudos") {
      // Laudos: salvar cada um individualmente — resolve limite 10MB
      const deletedIds = getDeletedIds(key);
      const toSave = value.filter(l => !deletedIds.includes(l.id));
      await Promise.all(toSave.map(l => saveLaudoFB(l)));
      // Deletar os removidos
      await Promise.all(deletedIds.map(id =>
        window.DB.ref("meca/laudos/" + id).remove().catch(function(){})
      ));
      return value;
    }
    const snap = await window.DB.ref(key).once("value");
    const deletedIds = getDeletedIds(key);
    const remote = listOrEmpty(snap.val()).filter(item => !deletedIds.includes(item.id));
    const merged = mergeRecordLists(value, remote).filter(item => !deletedIds.includes(item.id));
    await window.DB.ref(key).set(merged);
    saveLocal(key, merged);
    return merged;
  }
  await window.DB.ref(key).set(value);
  return value;
}

async function load(key, fallback) {
  const local = loadLocal(key, fallback);

    try {
      return await new Promise((resolve) => {
        window.DB.ref(key).once("value", snap => {
          try {
            const v = snap.val();
            if (v !== null && v !== undefined) {

              // listOrEmpty converte objeto Firebase {id:{...}} ou array para array limpo
              const remoteList = listOrEmpty(v).filter(item => !deletedIds.includes(item.id));
              const next = getPendingKeys().includes(key)
                ? mergeRecordLists(local, remoteList).filter(item => !deletedIds.includes(item.id))
                : remoteList.length > 0 ? remoteList : local;
              saveLocal(key, next);
              resolve(next);
            } else {
              if (local !== fallback) markPending(key);
              resolve(local);
            }
          } catch(e2) { resolve(local); }
        }, () => resolve(local));
      });
    } catch(_e) { return local; }
  } else { return local; }
}

async function save(key, value) {
  saveLocal(key, value);
  if (FB_CONFIGURED && window.DB) {
    try {
      await saveRemote(key, value);
      unmarkPending(key);
    } catch(e) {
      markPending(key);
      console.warn("Firebase save error:", e.message);
    }
  }
}

async function syncPending() {
  if (!FB_CONFIGURED || !window.DB || navigator.onLine === false) return;
  const keys = getPendingKeys();
  for (const key of keys) {
    const value = loadLocal(key, undefined);
    if (value === undefined) continue;
    try {
      await saveRemote(key, value);
      unmarkPending(key);
    } catch(e) {
      console.warn("Sync pendente falhou:", e.message);
      break;
    }
  }
}


// ═══════════════════════════════════════════════════════════════
// INDEXEDDB — para dados grandes (PDFs de manuais)
// Limite: sem limite prático (GBs), persiste offline
// ═══════════════════════════════════════════════════════════════
// Manuais IDB — usa openMecaIDB() compartilhado acima
const IDB_STORE = "manuals_data";

async function idbSaveManuals(folders) {
  // Salva lista de pastas SEM os dados dos PDFs no Firebase
  // Salva os dados dos PDFs (base64) no IndexedDB
  try {
    const db = await openMecaIDB();
    const tx = db.transaction(IDB_STORE, "readwrite");
    const store = tx.objectStore(IDB_STORE);
    // Limpa tudo e re-salva
    store.clear();
    for (const folder of (folders || [])) {
      for (const item of (folder.items || [])) {
        if (item.data) {
          store.put({ id: item.id, data: item.data });
        }
      }
    }
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
  } catch(e) { console.warn("IDB save error:", e); }
  
  // Para Firebase/localStorage: salvar sem o campo .data (economiza espaço)
  const light = (folders || []).map(f => ({
    ...f,
    items: (f.items || []).map(it => ({ ...it, data: undefined }))
  }));
  return light;
}

async function idbLoadManuals(lightFolders) {
  // Reintegra os dados dos PDFs nos folders
  if (!lightFolders || !lightFolders.length) return lightFolders;
  try {
    const db = await openMecaIDB();
    const tx = db.transaction(IDB_STORE, "readonly");
    const store = tx.objectStore(IDB_STORE);
    const allReq = store.getAll();
    const allItems = await new Promise((res, rej) => { allReq.onsuccess = e => res(e.target.result); allReq.onerror = rej; });
    const dataMap = {};
    for (const it of allItems) dataMap[it.id] = it.data;
    return lightFolders.map(f => ({
      ...f,
      items: (f.items || []).map(it => ({ ...it, data: dataMap[it.id] || it.data || "" }))
    }));
  } catch(e) {
    console.warn("IDB load error:", e);
    return lightFolders;
  }
}

async function saveManuals(folders) {
  const light = await idbSaveManuals(folders);
  await save(K.manuals, light);
}

async function loadManuals() {
  const light = await load(K.manuals, []);
  return idbLoadManuals(listOrEmpty(light));
}

function subscribe(key, callback) {
  if (FB_CONFIGURED && window.DB && navigator.onLine !== false) {
    const ref = window.DB.ref(key);
    ref.on("value", snap => {
      const v = snap.val();
      if (v !== null && v !== undefined) {
        const deletedIds = getDeletedIds(key);
        const remote = listOrEmpty(v).filter(item => !deletedIds.includes(item.id));
        if (getPendingKeys().includes(key)) {
          const local = loadLocal(key, []);
          const next = mergeRecordLists(local, remote).filter(item => !deletedIds.includes(item.id));
          saveLocal(key, next);
          callback(next);
          return;
        }
        saveLocal(key, remote);
        callback(remote);
      }
    });
    return () => ref.off("value");
  }
  return () => {};
}

function downloadDoc(html, title) {
  const safeName = (title||"documento").replace(/[^\w\u00C0-\u024F\s-]/g,"").trim()||"documento";
  try {
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = safeName+".html"; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},5000);
    return;
  } catch(e1){}
  try {
    const encoded = encodeURIComponent(html);
    const a = document.createElement("a");
    a.href = "data:text/html;charset=utf-8,"+encoded;
    a.download = safeName+".html"; a.style.display="none";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    return;
  } catch(e2){}
  try {
    window.location.href = "data:text/html;charset=utf-8,"+encodeURIComponent(html);
  } catch(e3){
    alert("Não foi possível abrir o documento neste dispositivo.");
  }
}

function buildApptDoc(a, clients) {

function buildLaudoDoc(l) {
  const sl = {pendente:"Pendente",aprovado:"Aprovado",reprovado:"Reprovado",concluido:"Conclu\u00eddo"};
  const dl = l.date ? new Date(l.date+"T12:00:00").toLocaleDateString("pt-BR") : "—";
  let h = hdrHTML("LAUDO T\u00c9CNICO", dl);
  h += clientHTML({...l, clientCity:l.clientCity});
  var timeStr = (l.arrivalTime||l.departureTime) ? ((l.arrivalTime?"Chegada: "+l.arrivalTime:"")+(l.arrivalTime&&l.departureTime?" | ":"")+(l.departureTime?"Sa\u00edda: "+l.departureTime:"")) : "";
  h += '<h2>Equipamento</h2><div class="ig">'
    +'<div class="ii"><label>Equipamento</label><span>'+(l.equipment||"—")+'</span></div>'
    +'<div class="ii"><label>N\u00ba S\u00e9rie</label><span>'+(l.serialNumber||"—")+'</span></div>'
    +'<div class="ii"><label>T\u00e9cnico</label><span>'+(l.techName||"—")+'</span></div>'
    +'<div class="ii"><label>Status</label><span>'+(sl[l.status]||l.status)+'</span></div>'
    +(timeStr?'<div class="ii" style="grid-column:1/-1"><label>Hor\u00e1rio</label><span>'+timeStr+'</span></div>':"")+"</div>";
  if (l.problem)        h += '<h2>Problema Relatado</h2><p>'+l.problem+'</p>';
  if (l.diagnosis)      h += '<h2>Diagn\u00f3stico</h2><p>'+l.diagnosis+'</p>';
  if (l.recommendation) h += '<h2>Recomenda\u00e7\u00e3o</h2><p>'+l.recommendation+'</p>';
  if (l.result)         h += '<h2>Resultado</h2><p>'+l.result+'</p>';
  if (l.notes)          h += '<div class="obs">'+l.notes+'</div>';
  if (l.photos&&l.photos.length) {
    h += '<h2>Fotos</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0">';
    l.photos.forEach(p=>{ h += '<img src="'+p.data+'" style="width:100%;height:110px;object-fit:cover;border-radius:6px;border:1px solid #eee"/>'; });
    h += '</div>';
  }
  h += sigHTML(l.sigClient||"");
  return wrap(h, "Laudo");
}

function waText(tipo, lines) {

function openWA(text, phone) {
  const u = phone ? "https://wa.me/"+phone.replace(/\D/g,"")+"?text="+encodeURIComponent(text)

// SIGNATURE MODAL
// ═══════════════════════════════════════════════════════════════
function SignatureModal({onSave, onClose, initNome=""}) {
  const ref = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);
  const [hasSig, setHasSig] = useState(false);
  const [nome, setNome] = useState(initNome);
  const [doc, setDoc] = useState("");
  const [err, setErr] = useState("");

  function pos(e) {
    const c = ref.current; if (!c) return null;
    const r = c.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return {x:(s.clientX-r.left)*(c.width/r.width), y:(s.clientY-r.top)*(c.height/r.height)};
  }
  function down(e) { e.preventDefault(); drawing.current=true; const p=pos(e); if(!p)return; last.current=p; const ctx=ref.current.getContext("2d"); ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fillStyle="#0a2a6e"; ctx.fill(); }
  function move(e) { e.preventDefault(); if(!drawing.current||!last.current)return; const p=pos(e); if(!p)return; const ctx=ref.current.getContext("2d"); ctx.beginPath(); ctx.moveTo(last.current.x,last.current.y); ctx.lineTo(p.x,p.y); ctx.strokeStyle="#0a2a6e"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.stroke(); last.current=p; setHasSig(true); }
  function up(e) { e.preventDefault(); drawing.current=false; last.current=null; }
  function clear() { if(!ref.current)return; ref.current.getContext("2d").clearRect(0,0,640,200); setHasSig(false); }
  function confirm() {
    if (!nome.trim()) { setErr("Informe o nome do signatário."); return; }
    if (!hasSig) { setErr("Assine no campo abaixo."); return; }
    onSave({sigData:ref.current.toDataURL(), sigNome:nome.trim(), sigDoc:doc.trim()});
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:4000,padding:16}}>
      <div style={{background:C.navyM,borderRadius:16,border:"1px solid "+C.border,width:"100%",maxWidth:680,padding:24}}>
        <div style={{...row,justifyContent:"space-between",marginBottom:18}}>
          <span style={{fontSize:17,fontWeight:800,color:C.orange}}>✍️ Assinatura do Cliente</span>
          <button style={btn("ghost")} onClick={onClose}><Icon d={IC.x} size={18}/></button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div style={fld}><label style={lbl}>Nome Completo *</label>
            <input style={inp} value={nome} onChange={e=>{setNome(e.target.value);setErr("");}} placeholder="Nome"/></div>
          <div style={fld}><label style={lbl}>CPF / RG / Documento</label>
            <input style={inp} value={doc} onChange={e=>setDoc(e.target.value)} placeholder="000.000.000-00"/></div>
        </div>
        <label style={{...lbl,display:"block",marginBottom:8}}>Assinatura *</label>
        <div style={{position:"relative",background:"#fff",borderRadius:10,border:"3px solid "+C.blue}}>
          <canvas ref={ref} width={640} height={200}
            style={{display:"block",width:"100%",height:200,cursor:"crosshair",touchAction:"none"}}
            onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
            onTouchStart={down} onTouchMove={move} onTouchEnd={up}/>
          {!hasSig&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",color:"#bbb",fontSize:16,fontStyle:"italic"}}>Assine aqui com o dedo ou mouse</div>}
        </div>
        {err&&<div style={{marginTop:10,padding:"8px 14px",borderRadius:7,fontSize:13,fontWeight:600,background:"rgba(192,57,43,0.15)",color:"#e74c3c"}}>{err}</div>}
        <div style={{...row,justifyContent:"space-between",marginTop:18}}>
          <button style={{...btn("ghost"),padding:"10px 18px"}} onClick={clear}><Icon d={IC.trash} size={15}/>Limpar</button>
          <div style={row}>
            <button style={{...btn("ghost"),padding:"10px 18px"}} onClick={onClose}>Cancelar</button>
            <button style={{...btn("primary"),padding:"10px 22px"}} onClick={confirm}><Icon d={IC.check} size={15}/>Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function TabManuais({data, isMaster, onSaveFolder, onDeleteFolder}) {
  const folders = listOrEmpty(data);
  const [active, setActive] = useState((folders[0]&&folders[0].id) || null);
  const [msg, setMsg] = useState(null);
  const [folderName, setFolderName] = useState("");
  const [manualTitle, setManualTitle] = useState("");
  const flash = (t,tp="success")=>{setMsg({text:t,type:tp});setTimeout(()=>setMsg(null),3000);};

  useEffect(() => {
    if (!folders.find(f => f.id === active)) setActive((folders[0]&&folders[0].id) || null);
  }, [data]);

  const current = folders.find(f => f.id === active);
  const createFolder = () => {
    const name = folderName.trim();
    if (!name) { flash("Informe o nome da pasta.","error"); return; }
    onSaveFolder({id:uid(),name,items:[],createdAt:new Date().toISOString()});
    setFolderName("");
    flash("Pasta criada.");
  };
  const [manualLink, setManualLink] = useState("");
  const [manualLinkTitle, setManualLinkTitle] = useState("");
  const [addMode, setAddMode] = useState("pdf"); // "pdf" | "link"

  const addPdf = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file || !current) return;
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      flash("Selecione um arquivo PDF.","error");
      return;
    }
    const dataUrl = await readFileAsDataURL(file);
    const item = {
      id:uid(),
      title:manualTitle.trim() || file.name.replace(/\.pdf$/i,""),
      fileName:file.name,
      size:file.size,
      data:dataUrl,
      type:"pdf",
      createdAt:new Date().toLocaleDateString("pt-BR")
    };
    onSaveFolder({...current,items:[item,...(current.items||[])]});
    setManualTitle("");
    flash("PDF adicionado.");
  };

  const addLink = () => {
    if (!current) return;
    const url = manualLink.trim();
    const title = manualLinkTitle.trim();
    if (!url) { flash("Informe o link.","error"); return; }
    if (!url.startsWith("http")) { flash("Link deve começar com http:// ou https://","error"); return; }
    if (!title) { flash("Informe um título para o link.","error"); return; }
    const item = {
      id:uid(),
      title,
      fileName:"",
      size:0,
      data:"",
      type:"link",
      url,
      createdAt:new Date().toLocaleDateString("pt-BR")
    };
    onSaveFolder({...current,items:[item,...(current.items||[])]});
    setManualLink("");
    setManualLinkTitle("");
    flash("Link adicionado.");
  };
  const deletePdf = itemId => {
    if (!current || !window.confirm("Excluir este PDF?")) return;
    onSaveFolder({...current,items:(current.items||[]).filter(i=>i.id!==itemId)});
    flash("PDF excluido.","error");
  };
  const openPdf = item => {
    const w = window.open();
    if (w) w.document.write(`<iframe src="${item.data}" style="border:0;width:100%;height:100vh"></iframe>`);
  };

  return <div><Alert msg={msg}/>
    <div style={{display:"grid",gridTemplateColumns:"minmax(220px,300px) 1fr",gap:16,alignItems:"start"}}>
      <div style={card}>
        <div style={{...row,justifyContent:"space-between",marginBottom:12}}>
          <h2 style={{fontSize:14,fontWeight:700,color:C.orange,margin:0}}>Manuais</h2>
          {!isMaster&&<span style={{fontSize:11,color:C.muted}}>Acesso livre</span>}
        </div>
        {isMaster&&<div style={{display:"flex",gap:8,marginBottom:14}}>
          <input placeholder="Nova pasta" value={folderName} onChange={e=>setFolderName(e.target.value)} style={inp}/>
          <button style={{...btn("primary"),padding:"9px 12px"}} onClick={createFolder}><Icon d={IC.plus} size={14}/></button>
        </div>}
        {!folders.length?<div style={{color:C.muted,fontSize:13}}>Nenhuma pasta cadastrada.</div>
          :<div style={{display:"flex",flexDirection:"column",gap:8}}>
            {folders.map(f=><button key={f.id} onClick={()=>setActive(f.id)}
              style={{display:"flex",alignItems:"center",gap:8,textAlign:"left",padding:"10px 12px",borderRadius:7,border:"1px solid "+(active===f.id?C.orange:C.border),background:active===f.id?"rgba(232,103,10,0.14)":C.navy,color:C.text,cursor:"pointer"}}>
              <Icon d={IC.folder} size={15}/>
              <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:700}}>{f.name}</span>
              <span style={{fontSize:11,color:C.muted}}>{(f.items||[]).length}</span>
            </button>)}
          </div>}
      </div>

      <div style={card}>
        {!current?<div style={{textAlign:"center",padding:48,color:"#3a5880"}}>Selecione ou crie uma pasta.</div>
          :<>
            <div style={{...row,justifyContent:"space-between",marginBottom:14,alignItems:"flex-start"}}>
              <div>
                <h2 style={{fontSize:14,fontWeight:700,color:C.orange,marginBottom:4}}>{current.name}</h2>
                <div style={{fontSize:12,color:C.muted}}>{(current.items||[]).length} PDF(s)</div>
              </div>
              {isMaster&&<button style={btn("danger")} onClick={()=>{if(window.confirm("Excluir pasta e PDFs?"))onDeleteFolder(current.id);}}><Icon d={IC.trash} size={14}/>Excluir Pasta</button>}
            </div>
            {isMaster&&<div style={{marginBottom:16}}>
              <div style={{...row,gap:8,marginBottom:10}}>
                <button style={{...btn(addMode==="pdf"?"primary":"ghost"),padding:"7px 14px",fontSize:12}} onClick={()=>setAddMode("pdf")}>📄 PDF</button>
                <button style={{...btn(addMode==="link"?"primary":"ghost"),padding:"7px 14px",fontSize:12}} onClick={()=>setAddMode("link")}>🔗 Link</button>
              </div>
              {addMode==="pdf"&&<div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:10}}>
                <input placeholder="Título do PDF" value={manualTitle} onChange={e=>setManualTitle(e.target.value)} style={inp}/>
                <label style={{...btn("primary"),cursor:"pointer"}}>
                  <Icon d={IC.file} size={14}/>Escolher PDF
                  <input type="file" accept="application/pdf,.pdf" onChange={addPdf} style={{display:"none"}}/>
                </label>
              </div>}
              {addMode==="link"&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
                <input placeholder="Título do link (ex: Manual LG WF5000)" value={manualLinkTitle} onChange={e=>setManualLinkTitle(e.target.value)} style={inp}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:10}}>
                  <input placeholder="URL (https://...)" value={manualLink} onChange={e=>setManualLink(e.target.value)} style={inp}/>
                  <button style={btn("primary")} onClick={addLink}><Icon d={IC.plus} size={14}/>Adicionar</button>
                </div>
              </div>}
            </div>}
            {!(current.items||[]).length?<div style={{textAlign:"center",padding:48,color:"#3a5880"}}>Nenhum PDF nesta pasta.</div>
              :<div style={{display:"flex",flexDirection:"column",gap:8}}>
                {(current.items||[]).map(item=>{
                  const isLink = item.type==="link"||(!item.data&&item.url);
                  return <div key={item.id} style={{background:C.navy,border:"1px solid "+C.border,borderRadius:8,padding:12,display:"flex",alignItems:"center",gap:12}}>
                    {isLink
                      ? <span style={{fontSize:20,flexShrink:0}}>🔗</span>
                      : <Icon d={IC.file} size={18}/>}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:800,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.title}</div>
                      <div style={{fontSize:12,color:C.muted}}>{isLink?((item.url||"").slice(0,50)+(item.url&&item.url.length>50?"...":"")):item.fileName} {item.createdAt?"- "+item.createdAt:""}</div>
                    </div>
                    {isLink
                      ? <a href={item.url} target="_blank" rel="noopener noreferrer" style={{...btn("blue"),textDecoration:"none"}}>Abrir Link</a>
                      : <><button style={btn("blue")} onClick={()=>openPdf(item)}>Abrir</button>
                           <a href={item.data} download={item.fileName} style={{...btn("ghost"),textDecoration:"none"}}>Baixar</a></>}
                    {isMaster&&<button style={btn("danger")} onClick={()=>deletePdf(item.id)}><Icon d={IC.trash} size={14}/></button>}
                  </div>;
                })}
              </div>}
          </>}
      </div>
    </div>
  </div>;
}

  const clrClient = ()=>{setSel(null);setForm(f=>({...f,clientName:"",clientDoc:"",clientPhone:"",clientAddress:"",clientCity:""}));};
  const total = form.items.reduce((s,it)=>s+parseBR(it.price)*Number(it.qty||0),0);

  const saveQ = ()=>{
    if (!form.clientName.trim()){flash("Informe o cliente.","error");return;}

  };

  // filtrar e ordenar orcamentos

  const filtOrc = data.filter(q=>{
    const mq=!sq||[q.clientName,q.clientDoc,q.clientCity].some(v=>(v||"").toLowerCase().includes(sq));
    const dp=(q.date||"").split("/");
    const diso=dp.length===3?dp[2]+"-"+dp[1]+"-"+dp[0]:"";

          {sel?<><span style={{background:"rgba(232,103,10,0.15)",color:C.orange,border:"1px solid #e8670a44",borderRadius:20,padding:"3px 14px",fontSize:12,fontWeight:700}}>✓ {sel.name}</span>

function LaudoModal({initial, clients, tecnicos, onSave, onClose}) {
  const [f, setF] = useState(initial?{...initial,photos:initial.photos||[],sigClient:initial.sigClient||""}:{id:"",clientId:"",clientName:"",clientPhone:"",clientAddress:"",clientCity:"",date:"",arrivalTime:"",departureTime:"",techName:"",equipment:"",serialNumber:"",problem:"",diagnosis:"",recommendation:"",result:"",status:"pendente",photos:[],notes:"",sigClient:""});
  const [cp, setCP] = useState(false);
  const [sigModal, setSigModal] = useState(false);
  const [photoErr, setPhotoErr] = useState("");
  const s = k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const selC = c=>{setF(p=>({...p,clientId:c.id,clientName:c.name,clientPhone:c.phone||"",clientAddress:c.address||"",clientCity:c.city+(c.uf?"/"+c.uf:"")}));setCP(false);};
  const activeTec = (tecnicos||[]).filter(t=>t.active);

  const addPhotos = e=>{
    const files = Array.from(e.target.files);
    const rem = 8-f.photos.length;
    if (files.length>rem) setPhotoErr("Máximo 8 fotos."); else setPhotoErr("");
    files.slice(0,rem).forEach(file=>{
      // Comprimir foto para max 700px e qualidade 0.50 → ~70KB por foto
      // Limite Firebase: 10MB por nó. 8 fotos × 70KB = 560KB — seguro
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const maxW = 600, maxH = 600;
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          const r = Math.min(maxW/w, maxH/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        const data = canvas.toDataURL("image/jpeg", 0.40);
        URL.revokeObjectURL(url);
        setF(p=>({...p, photos:[...p.photos, {name:file.name, data}]}));
      };
      img.src = url;
    });
    e.target.value="";
  };

  const hasSig = f.sigClient && (f.sigClient.sigData || typeof f.sigClient==="string"&&f.sigClient.length>50);

  return <Modal title={f.id?"Editar Laudo":"Novo Laudo Técnico"} onClose={onClose} maxWidth={700}>
    {cp&&<ClientPicker clients={clients} onSelect={selC} onClose={()=>setCP(false)}/>}
    {sigModal&&<SignatureModal onSave={v=>{setF(p=>({...p,sigClient:v}));setSigModal(false);}} onClose={()=>setSigModal(false)} initNome={f.clientName}/>}

      <div style={{...fld,gridColumn:"1/-1"}}><label style={lbl}>Cliente</label>
        <div style={{display:"flex",gap:8}}><input style={{...inp,flex:1}} value={f.clientName} onChange={s("clientName")} placeholder="Nome"/>
          <button style={{...btn("blue"),padding:"9px 12px",flexShrink:0}} onClick={()=>setCP(true)}><Icon d={IC.users} size={14}/>Buscar</button></div></div>
      <div style={fld}><label style={lbl}>Telefone</label><input style={inp} value={f.clientPhone} onChange={s("clientPhone")}/></div>
      <div style={fld}><label style={lbl}>Data</label><input type="date" style={inp} value={f.date} onChange={s("date")}/></div>
      <div style={fld}><label style={lbl}>Hora de Chegada</label><input type="time" style={inp} value={f.arrivalTime||""} onChange={s("arrivalTime")}/></div>
      <div style={fld}><label style={lbl}>Hora de Saída</label><input type="time" style={inp} value={f.departureTime||""} onChange={s("departureTime")}/></div>
      <div style={{...fld,gridColumn:"1/-1"}}><label style={lbl}>Endereço</label><input style={inp} value={f.clientAddress} onChange={s("clientAddress")} placeholder="Rua, nº, bairro"/></div>
      <div style={fld}><label style={lbl}>Cidade/UF</label><input style={inp} value={f.clientCity} onChange={s("clientCity")}/></div>
      <div style={fld}><label style={lbl}>Status</label>

function TabLaudo({clients, tecnicos, data, onSave, onDelete, authed, onLoginNeeded}) {
  const [modal, setModal] = useState(null);
  const [preview, setPreview] = useState(null);
  const [search, setSearch] = useState("");
  const [fs, setFS] = useState("todos");
  const [msg, setMsg] = useState(null);
  const flash = (t,tp="success")=>{setMsg({text:t,type:tp});setTimeout(()=>setMsg(null),3000);};

  const [sortDir, setSortDir] = useState("desc"); // desc = mais recente primeiro
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo]     = useState("");

  const filtered = data.filter(l=>{
    const ms=fs==="todos"||l.status===fs;
    const q=search.toLowerCase();
    const mq=!q||[l.clientName,l.equipment,l.techName].some(v=>(v||"").toLowerCase().includes(q));
    const df=!dateFrom||!l.date||(l.date>=dateFrom);
    const dt=!dateTo  ||!l.date||(l.date<=dateTo);
    return ms&&mq&&df&&dt;
  }).sort((a,b)=>{
    const ad=a.date||""; const bd=b.date||"";
    return sortDir==="desc" ? (bd>ad?1:-1) : (ad>bd?1:-1);
  });

  const counts = data.reduce((acc,l)=>{acc[l.status]=(acc[l.status]||0)+1;return acc;},{});

  return <div><Alert msg={msg}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:18}}>
      {Object.entries(LDST).map(([k,v])=><div key={k} style={{background:C.navyM,border:"1px solid "+C.border,borderRadius:10,padding:"14px 18px",borderLeft:"3px solid "+v.color,cursor:"pointer",opacity:fs===k||fs==="todos"?1:0.5}} onClick={()=>setFS(fs===k?"todos":k)}>
        <div style={{fontSize:22,fontWeight:800,color:v.color}}>{counts[k]||0}</div>
        <div style={{fontSize:12,color:C.muted,marginTop:2}}>{v.label}</div>
      </div>)}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
      <div style={{...row,justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <input placeholder="Buscar por cliente, equip., técnico…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,flex:1,minWidth:180}}/>
        <div style={row}>
          <select style={{...inp,width:"auto"}} value={fs} onChange={e=>setFS(e.target.value)}>
            <option value="todos">Todos</option>{Object.entries(LDST).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
          </select>
          <button style={{...btn("ghost"),padding:"8px 12px",fontSize:12}} onClick={()=>setSortDir(d=>d==="desc"?"asc":"desc")}>
            {sortDir==="desc"?"↓ Mais recente":"↑ Mais antigo"}
          </button>
          <button style={btn("primary")} onClick={()=>setModal("new")}><Icon d={IC.plus} size={15}/>Novo Laudo</button>
        </div>
      </div>
      <div style={{...row,gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:C.muted,alignSelf:"center"}}>Período:</span>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={{...inp,width:"auto",fontSize:12}} title="De"/>
        <span style={{fontSize:12,color:C.muted,alignSelf:"center"}}>até</span>
        <input type="date" value={dateTo}   onChange={e=>setDateTo(e.target.value)}   style={{...inp,width:"auto",fontSize:12}} title="Até"/>
        {(dateFrom||dateTo)&&<button style={{...btn("ghost"),padding:"6px 12px",fontSize:12}} onClick={()=>{setDateFrom("");setDateTo("");}}>✕ Limpar</button>}
        <span style={{fontSize:12,color:C.muted,alignSelf:"center"}}>{filtered.length} registro(s)</span>
      </div>
    </div>
    {filtered.length===0?<div style={{...card,textAlign:"center",padding:48,color:"#3a5880"}}>{data.length===0?"Nenhum laudo ainda.":"Sem resultados."}</div>
      :<div style={{display:"flex",flexDirection:"column",gap:12}}>
        {filtered.map(l=>{const d=l.date?new Date(l.date+"T12:00:00").toLocaleDateString("pt-BR"):"—";return <div key={l.id} style={{background:C.navyM,border:"1px solid "+C.border,borderRadius:12,padding:"16px 18px",borderLeft:"4px solid "+((LDST[l.status]&&LDST[l.status].color)||C.border)}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
            <div style={{flex:1}}>
              <div style={{...row,marginBottom:6,flexWrap:"wrap"}}>
                <span style={{fontWeight:800,fontSize:15}}>{l.clientName}</span><LBadge status={l.status}/>
                <span style={{fontSize:12,color:C.muted}}>📅 {d}</span>{l.arrivalTime&&<span style={{fontSize:12,color:C.blueL}}>🕐 Entrada: {l.arrivalTime}</span>}{l.departureTime&&<span style={{fontSize:12,color:C.blueL}}>🕐 Saída: {l.departureTime}</span>}
              </div>
              {l.equipment&&<div style={{fontSize:13,color:C.blueL,marginBottom:3}}>⚙️ {l.equipment}{l.serialNumber?" · Série: "+l.serialNumber:""}</div>}
              {l.techName&&<div style={{fontSize:12,color:C.muted}}>👷 {l.techName}</div>}
              {l.clientAddress&&<div style={{fontSize:12,color:C.muted}}>📍 {l.clientAddress}</div>}
              {l.problem&&<div style={{fontSize:12,color:C.text,marginTop:6,fontStyle:"italic",borderLeft:"2px solid "+C.border,paddingLeft:8}}>{l.problem.slice(0,120)}{l.problem.length>120?"…":""}</div>}
              {l.photos&&l.photos.length>0&&<div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>{l.photos.map((ph,i)=><img key={i} src={ph.data} alt="" style={{width:88,height:88,objectFit:"cover",borderRadius:8,border:"2px solid "+C.border,cursor:"pointer"}}/>)}</div>}
              {l.sigClient&&(l.sigClient.sigData||typeof l.sigClient==="string"&&l.sigClient.length>50)&&<div style={{fontSize:11,color:C.blueL,marginTop:6}}>✍️ {l.sigClient.sigNome?l.sigClient.sigNome+" — assinado":"Cliente assinado"}</div>}
            </div>
            <div style={{...row,flexShrink:0}}>
              <button style={{...btn("blue"),padding:"6px 11px",fontSize:12}} onClick={()=>setPreview({html:buildLaudoDoc(l),title:"Laudo – "+l.clientName})}><Icon d={IC.down} size={13}/>PDF</button>
              <button style={{background:"#25D366",border:"none",borderRadius:7,padding:"6px 11px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer"}} onClick={()=>openWA(waText("LAUDO TÉCNICO",[`*Cliente:* ${l.clientName}`,l.clientPhone?`*Tel:* ${l.clientPhone}`:"",l.clientAddress?`*End:* ${l.clientAddress}`:"",l.date?`*Data:* ${d}`:"",l.arrivalTime?`*Chegada:* ${l.arrivalTime}`:"",l.departureTime?`*Saída:* ${l.departureTime}`:"",l.techName?`*Técnico:* ${l.techName}`:"",l.equipment?`*Equipamento:* ${l.equipment}`:"",`*Status:* ${(LDST[l.status]&&LDST[l.status].label)||l.status}`,l.diagnosis?`\n*Diagnóstico:* ${l.diagnosis}`:"",l.result?`\n*Resultado:* ${l.result}`:"",l.sigClient&&l.sigClient.sigNome?`\n*Assinado por:* ${l.sigClient.sigNome}${l.sigClient.sigDoc?" ("+l.sigClient.sigDoc+")":""}`:""  ].filter(Boolean)),l.clientPhone)}>📲</button>
              <button style={btn("ghost")} onClick={()=>setModal(l)}><Icon d={IC.edit} size={14}/></button>
              <button style={btn("danger")} onClick={()=>{if(!authed){onLoginNeeded();return;}if(window.confirm("Excluir este laudo?"))onDelete(l.id);flash("Excluído.","error");}}><Icon d={IC.trash} size={14}/></button>
            </div>
          </div>
        </div>;})}
      </div>}
    {modal!==null&&<LaudoModal initial={modal==="new"?null:modal} clients={clients} tecnicos={tecnicos} onSave={item=>{
  setModal(null);
  flash("💾 Salvando laudo...");
  onSave(item);
  setTimeout(()=>flash("✅ Laudo salvo!"), 800);
}} onClose={()=>setModal(null)}/>}
    {preview&&<DocPreview html={preview.html} title={preview.title} onClose={()=>setPreview(null)}/>}
  </div>;
}

const ALL_TABS_CONFIG = [
  {id:"laudo",       label:"Laudo Técnico"},
  {id:"controle",    label:"Controle"},
  {id:"agendamento", label:"Agendamento"},
  {id:"orcamento",   label:"Orçamento"},

  {id:"clientes",    label:"Clientes"},

  {id:"tecnicos",    label:"Técnicos"},
];

const DEFAULT_USER = {id:"",name:"",login:"",password:"",tabs:["laudo","clientes","manuais"],active:true,notes:""};

function UserModal({initial, onSave, onClose}) {
  const [f, setF] = useState(initial ? {...initial} : {...DEFAULT_USER});
  const s = k => e => setF(p => ({...p, [k]: e.target.value}));
  const [show, setShow] = useState(false);

  const toggleTab = tabId => {
    setF(p => ({
      ...p,
      tabs: p.tabs.includes(tabId) ? p.tabs.filter(t => t !== tabId) : [...p.tabs, tabId]
    }));
  };

  return <Modal title={f.id ? "Editar Usuário" : "Novo Usuário"} onClose={onClose} maxWidth={520}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <div style={{...fld,gridColumn:"1/-1"}}><label style={lbl}>Nome completo *</label>
        <input style={inp} value={f.name} onChange={s("name")} placeholder="Ex: João Silva"/></div>
      <div style={fld}><label style={lbl}>Login (usuário) *</label>
        <input style={inp} value={f.login} onChange={s("login")} placeholder="Ex: joao"/></div>
      <div style={fld}><label style={lbl}>Senha *</label>
        <div style={{position:"relative"}}>
          <input type={show?"text":"password"} style={{...inp,paddingRight:38}} value={f.password} onChange={s("password")} placeholder="Mínimo 4 chars"/>
          <button onClick={()=>setShow(v=>!v)} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:C.muted}}>
            <Icon d={IC.eye} size={14}/>
          </button>
        </div>
      </div>
      <div style={fld}><label style={lbl}>Status</label>
        <select style={inp} value={f.active?"ativo":"inativo"} onChange={e=>setF(p=>({...p,active:e.target.value==="ativo"}))}>
          <option value="ativo">Ativo</option><option value="inativo">Inativo</option>
        </select>
      </div>
      <div style={{...fld,gridColumn:"1/-1",marginTop:4}}>
        <label style={{...lbl,marginBottom:10}}>Abas que este usuário pode acessar</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {ALL_TABS_CONFIG.map(t => {
            const on = f.tabs.includes(t.id);
            return <button key={t.id} onClick={()=>toggleTab(t.id)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:7,
                border:"1px solid "+(on?C.orange:C.border),
                background:on?"rgba(232,103,10,0.12)":C.navy,
                color:on?C.orange:C.muted,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit",textAlign:"left"}}>
              <span style={{width:14,height:14,borderRadius:3,border:"2px solid "+(on?C.orange:C.border),
                background:on?C.orange:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff"}}>
                {on?"✓":""}
              </span>
              {t.label}
            </button>;
          })}
        </div>
      </div>
      <div style={{...fld,gridColumn:"1/-1"}}><label style={lbl}>Observações</label>
        <textarea style={{...inp,resize:"vertical",minHeight:48}} value={f.notes} onChange={s("notes")}/></div>
    </div>
    <div style={{...row,justifyContent:"flex-end",marginTop:18,gap:10}}>
      <button style={btn("ghost")} onClick={onClose}>Cancelar</button>
      <button style={btn("primary")} onClick={()=>{
        if(!f.name.trim()||!f.login.trim()||!f.password){
          alert("Preencha nome, login e senha."); return;
        }
        onSave({...f, id:f.id||uid()});
      }}><Icon d={IC.save} size={15}/>Salvar</button>
    </div>
  </Modal>;
}

                <button style={btn("danger")} onClick={()=>{if(window.confirm("Excluir usuário "+u.name+"?"))onDelete(u.id);flash("Excluído.","error");}}><Icon d={IC.trash} size={14}/></button>

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
               "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS_SEMANA = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

function buildGCalUrl(appt, clients) {
  if (!appt.date) return null;
  var cl = (clients||[]).find(function(c){ return c.name===appt.clientName||(appt.clientId&&c.id===appt.clientId); });
  var addr = appt.clientAddress||(cl?fullAddr(cl):"");
  var title = encodeURIComponent("OS: "+appt.clientName+(appt.techName?" - "+appt.techName:""));
  var details = encodeURIComponent(
    (appt.serviceDesc?"Serviço: "+appt.serviceDesc+"\n":"") +
    (appt.techName?"Técnico: "+appt.techName+"\n":"") +
    (appt.clientPhone?"Tel: "+appt.clientPhone+"\n":"") +
    (appt.notes?"Obs: "+appt.notes:"")
  );
  var loc = encodeURIComponent(addr);
  var parts = appt.date.split("-");
  var y=parts[0], m=parts[1], d=parts[2];
  var hh = appt.time ? appt.time.replace(":","") : "0800";
  var h2 = appt.time ? String(parseInt(appt.time.split(":")[0])+1).padStart(2,"0")+appt.time.split(":")[1] : "0900";
  var start = y+m+d+"T"+hh+"00";
  var end   = y+m+d+"T"+h2+"00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+title+"&details="+details+"&location="+loc+"&dates="+start+"/"+end;
}

function CalDayCell({day, events, isToday, isOtherMonth, onClick}) {
  return (
    <div onClick={onClick}
      style={{minHeight:72,padding:"4px 5px",borderRadius:6,cursor:"pointer",
        background:isToday?"rgba(232,103,10,0.18)":isOtherMonth?"rgba(255,255,255,0.02)":"rgba(255,255,255,0.04)",
        border:"1px solid "+(isToday?C.orange:"rgba(255,255,255,0.06)")}}>
      <div style={{fontSize:12,fontWeight:isToday?800:500,
        color:isToday?C.orange:isOtherMonth?"#3a5275":C.text,marginBottom:3}}>{day}</div>
      {events.slice(0,2).map(function(ev,i){
        var st = APST[ev.status]||{bg:"rgba(26,111,181,0.15)",color:"#6a9fd8"};
        return <div key={i} style={{fontSize:10,fontWeight:600,padding:"1px 4px",
          borderRadius:3,marginBottom:2,background:st.bg,color:st.color,
          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
          {ev.time&&<span style={{opacity:0.8}}>{ev.time} </span>}
          {ev.clientName}
        </div>;
      })}
      {events.length>2&&<div style={{fontSize:10,color:C.muted}}>+{events.length-2}</div>}
    </div>
  );
}

function CalDayModal({dateStr, events, clients, onClose}) {
  var dl = new Date(dateStr+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  return (
    <Modal title={"📅 "+dl} onClose={onClose} maxWidth={480}>
      {events.length===0
        ? <div style={{textAlign:"center",padding:32,color:C.muted}}>Nenhum agendamento.</div>
        : <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {events.map(function(ev){
              var gcUrl = buildGCalUrl(ev, clients);
              var st = APST[ev.status]||{label:ev.status,color:C.border,bg:"rgba(128,128,128,0.1)"};
              return (
                <div key={ev.id} style={{background:C.navy,borderRadius:8,padding:"12px 14px",
                  borderLeft:"4px solid "+st.color}}>
                  <div style={{...row,justifyContent:"space-between",marginBottom:6,flexWrap:"wrap",gap:6}}>
                    <span style={{fontWeight:800,fontSize:14}}>{ev.clientName}</span>
                    <span style={{background:st.bg,color:st.color,borderRadius:20,
                      padding:"2px 10px",fontSize:11,fontWeight:700}}>{st.label}</span>
                  </div>
                  {ev.time&&<div style={{fontSize:12,color:C.blueL,marginBottom:3}}>🕐 {ev.time}</div>}
                  {ev.techName&&<div style={{fontSize:12,color:C.muted,marginBottom:3}}>👷 {ev.techName}</div>}
                  {ev.clientPhone&&<div style={{fontSize:12,color:C.muted,marginBottom:3}}>📞 {ev.clientPhone}</div>}
                  {ev.serviceDesc&&<div style={{fontSize:12,color:C.text,marginBottom:6,fontStyle:"italic"}}>{ev.serviceDesc}</div>}
                  {gcUrl&&<a href={gcUrl} target="_blank" rel="noopener noreferrer"
                    style={{display:"inline-flex",alignItems:"center",gap:5,
                      padding:"6px 12px",borderRadius:6,background:"#4285f4",
                      color:"#fff",textDecoration:"none",fontSize:11,fontWeight:700}}>
                    📅 Google Agenda
                  </a>}
                </div>
              );
            })}
          </div>}
    </Modal>
  );
}

function TabCalendario({schedule, currentUser, isMaster, clients}) {
  var today = new Date();
  var [viewYear,  setViewYear]  = useState(today.getFullYear());
  var [viewMonth, setViewMonth] = useState(today.getMonth());
  var [selDay,    setSelDay]    = useState(null);
  var [viewMode,  setViewMode]  = useState("month");
  var [filterTec, setFilterTec] = useState("todos");

  var todayStr = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");

  var mySchedule = (schedule||[]).filter(function(a) {
    if (isMaster) return filterTec==="todos"||(a.techName||"")===filterTec;
    var userName = (currentUser&&currentUser.name)||"";
    return (a.techName||"").toLowerCase().trim()===userName.toLowerCase().trim();
  });

  var tecList = [...new Set((schedule||[]).map(function(a){return a.techName;}).filter(Boolean))].sort();

  function getEventsForDate(y, m, d) {
    var ds = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    return mySchedule.filter(function(a){return a.date===ds;}).sort(function(a,b){return (a.time||"")>(b.time||"")?1:-1;});
  }

  function buildGrid(year, month) {
    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var daysInPrev  = new Date(year, month, 0).getDate();
    var cells = [];
    for (var i=firstDay-1; i>=0; i--) cells.push({day:daysInPrev-i,m:month-1,y:year,other:true});
    for (var d=1; d<=daysInMonth; d++) cells.push({day:d,m:month,y:year,other:false});
    var rem = 42-cells.length;
    for (var j=1; j<=rem; j++) cells.push({day:j,m:month+1,y:year,other:true});
    return cells;
  }

  var grid = buildGrid(viewYear, viewMonth);
  var monthStr = viewYear+"-"+String(viewMonth+1).padStart(2,"0");
  var monthEvents = mySchedule.filter(function(a){return a.date&&a.date.startsWith(monthStr);});

  var statKeys = ["agendado","confirmado","concluido","cancelado"];
  var stats = statKeys.map(function(k){
    var v = APST[k]||{label:k,color:"#888",bg:"rgba(128,128,128,0.1)"};
    return {key:k,label:v.label,color:v.color,bg:v.bg,
      count:monthEvents.filter(function(a){return a.status===k;}).length};
  });

  var selDateStr = selDay
    ? viewYear+"-"+String(viewMonth+1).padStart(2,"0")+"-"+String(selDay).padStart(2,"0")
    : null;
  var selEvents = selDateStr ? getEventsForDate(viewYear, viewMonth, selDay) : [];

  var upcoming = mySchedule
    .filter(function(a){return a.date&&a.date>=todayStr;})
    .sort(function(a,b){return (a.date+(a.time||""))>(b.date+(b.time||""))?1:-1;})
    .slice(0,30);

  function prevMonth(){if(viewMonth===0){setViewMonth(11);setViewYear(function(y){return y-1;});}else setViewMonth(function(m){return m-1;});}
  function nextMonth(){if(viewMonth===11){setViewMonth(0);setViewYear(function(y){return y+1;});}else setViewMonth(function(m){return m+1;});}

  return (
    <div>
      {/* Navegação */}
      <div style={{...row,justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:10}}>
        <div style={row}>
          <button style={{...btn("ghost"),padding:"8px 12px"}} onClick={prevMonth}>‹</button>
          <span style={{fontSize:17,fontWeight:800,color:C.orange,minWidth:180,textAlign:"center"}}>
            {MESES[viewMonth]} {viewYear}
          </span>
          <button style={{...btn("ghost"),padding:"8px 12px"}} onClick={nextMonth}>›</button>
          <button style={{...btn("ghost"),fontSize:12,padding:"6px 12px"}} onClick={function(){setViewYear(today.getFullYear());setViewMonth(today.getMonth());}}>Hoje</button>
        </div>
        <div style={row}>
          {isMaster&&(
            <select style={{...inp,width:"auto",fontSize:12}} value={filterTec} onChange={function(e){setFilterTec(e.target.value);}}>
              <option value="todos">👥 Todos</option>
              {tecList.map(function(t){return <option key={t} value={t}>👷 {t}</option>;})}
            </select>
          )}
          {!isMaster&&currentUser&&(
            <span style={{fontSize:12,color:C.blueL,padding:"6px 14px",
              background:"rgba(26,111,181,0.12)",borderRadius:20,border:"1px solid rgba(26,111,181,0.3)"}}>
              👷 {currentUser.name}
            </span>
          )}
          <button style={btn(viewMode==="month"?"primary":"ghost")} onClick={function(){setViewMode("month");}}>Mês</button>
          <button style={btn(viewMode==="list"?"primary":"ghost")} onClick={function(){setViewMode("list");}}>Lista</button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
        {stats.map(function(s){return (
          <div key={s.key} style={{background:s.bg,border:"1px solid "+s.color+"44",
            borderRadius:8,padding:"10px 12px",borderLeft:"3px solid "+s.color}}>
            <div style={{fontSize:20,fontWeight:800,color:s.color}}>{s.count}</div>
            <div style={{fontSize:11,color:C.muted}}>{s.label}</div>
          </div>
        );})}
      </div>

      {/* Vista Mês */}
      {viewMode==="month"&&(
        <div style={{background:C.navyM,borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:"1px solid "+C.border}}>
            {DIAS_SEMANA.map(function(d){return (
              <div key={d} style={{padding:"10px 0",textAlign:"center",fontSize:11,fontWeight:700,color:C.blueL}}>{d}</div>
            );})}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,padding:4}}>
            {grid.map(function(cell,i){
              var evs = cell.other?[]:getEventsForDate(cell.y,cell.m,cell.day);
              var ds2 = cell.y+"-"+String(cell.m+1).padStart(2,"0")+"-"+String(cell.day).padStart(2,"0");
              return (
                <CalDayCell key={i} day={cell.day} events={evs}
                  isToday={ds2===todayStr&&!cell.other} isOtherMonth={cell.other}
                  onClick={cell.other?function(){}:function(){setSelDay(cell.day);}}/>
              );
            })}
          </div>
        </div>
      )}

      {/* Vista Lista */}
      {viewMode==="list"&&(
        <div>
          <div style={{fontSize:13,color:C.muted,marginBottom:12}}>Próximos {upcoming.length} agendamentos</div>
          {upcoming.length===0
            ? <div style={{...card,textAlign:"center",padding:40,color:"#3a5880"}}>Nenhum agendamento futuro.</div>
            : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {upcoming.map(function(a){
                  var gcUrl = buildGCalUrl(a, clients);
                  var st = APST[a.status]||{label:a.status,color:C.border,bg:"rgba(128,128,128,0.1)"};
                  var dl2 = a.date?new Date(a.date+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}):"—";
                  return (
                    <div key={a.id} style={{background:C.navyM,borderRadius:10,
                      border:"1px solid "+st.color+"44",borderLeft:"4px solid "+st.color,
                      padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                      <div style={{textAlign:"center",minWidth:52,flexShrink:0}}>
                        <div style={{fontSize:15,fontWeight:800,color:C.orange}}>{dl2}</div>
                        {a.time&&<div style={{fontSize:12,color:C.blueL,fontWeight:700}}>{a.time}</div>}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{...row,gap:8,marginBottom:4,flexWrap:"wrap"}}>
                          <span style={{fontWeight:800,fontSize:14}}>{a.clientName}</span>
                          <span style={{background:st.bg,color:st.color,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>{st.label}</span>
                        </div>
                        {a.serviceDesc&&<div style={{fontSize:12,color:C.text}}>{a.serviceDesc}</div>}
                        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                          {a.techName&&<span style={{fontSize:12,color:C.blueL}}>👷 {a.techName}</span>}
                          {a.clientPhone&&<span style={{fontSize:12,color:C.muted}}>📞 {a.clientPhone}</span>}
                        </div>
                      </div>
                      {gcUrl&&<a href={gcUrl} target="_blank" rel="noopener noreferrer"
                        style={{display:"inline-flex",alignItems:"center",gap:4,padding:"6px 10px",
                          borderRadius:6,background:"#4285f4",color:"#fff",
                          textDecoration:"none",fontSize:11,fontWeight:700,flexShrink:0}}>
                        📅 Google
                      </a>}
                    </div>
                  );
                })}
              </div>}
        </div>
      )}

      {/* Modal dia */}
      {selDay&&selDateStr&&(
        <CalDayModal dateStr={selDateStr} events={selEvents}
          clients={clients} onClose={function(){setSelDay(null);}}/>
      )}
    </div>
  );
}

const FILTROS = [
  {id:"todos",label:"Todos"},{id:"laudo",label:"Laudos"},
  {id:"orcamento",label:"Orçamentos"},{id:"agendamento",label:"Agendamentos"},
];
const STATUS_CORES = {
  pendente:{bg:"rgba(243,156,18,0.15)",color:"#f39c12"},aprovado:{bg:"rgba(39,174,96,0.15)",color:"#27ae60"},
  reprovado:{bg:"rgba(231,76,60,0.15)",color:"#e74c3c"},agendado:{bg:"rgba(26,111,181,0.15)",color:"#1a6fb5"},
  confirmado:{bg:"rgba(46,204,113,0.15)",color:"#2ecc71"},cancelado:{bg:"rgba(231,76,60,0.15)",color:"#e74c3c"},
  emitido:{bg:"rgba(232,103,10,0.15)",color:"#e8670a"},concluido:{bg:"rgba(39,174,96,0.15)",color:"#27ae60"},
};
function StatusPill({status}) {
  const labels={pendente:"Pendente",aprovado:"Aprovado",reprovado:"Reprovado",agendado:"Agendado",confirmado:"Confirmado",cancelado:"Cancelado",concluido:"Concluído",emitido:"Emitido"};
  const s=STATUS_CORES[status]||{bg:"rgba(120,120,120,0.15)",color:"#888"};
  return <span style={{background:s.bg,color:s.color,border:"1px solid "+s.color+"44",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{labels[status]||status}</span>;
}

function TabControle({laudos, quotes, schedule}) {
  const [filtro, setFiltro] = useState("todos");
  const [search, setSearch] = useState("");
  const allItems = [
    ...(laudos||[]).map(l=>({tipo:"laudo",id:l.id,cliente:l.clientName||"—",data:l.date||"",status:l.status||"pendente",detalhe:l.equipment||(l.problem?l.problem.slice(0,60):""),tecnico:l.techName||""})),
    ...(quotes||[]).map(q=>({tipo:"orcamento",id:q.id,cliente:q.clientName||"—",data:q.date||"",status:"emitido",detalhe:"R$ "+fmt(q.total||0)+" · "+(q.items||[]).filter(i=>i.desc).length+" serviço(s)",tecnico:""})),
    ...(schedule||[]).map(a=>({tipo:"agendamento",id:a.id,cliente:a.clientName||"—",data:a.date||"",status:a.status||"agendado",detalhe:a.serviceDesc||(a.techName?"Técnico: "+a.techName:""),tecnico:a.techName||""})),
  ].sort((a,b)=>{if(!a.data&&!b.data)return 0;if(!a.data)return 1;if(!b.data)return -1;return b.data.localeCompare(a.data);});

  const tipoLabel={laudo:"Laudo",orcamento:"Orçamento",agendamento:"Agendamento"};
  const tipoIcon={laudo:"📋",orcamento:"📄",agendamento:"📅"};
  const tipoColor={laudo:"#6a9fd8",orcamento:"#e8670a",agendamento:"#2ecc71"};

  const filtered=allItems.filter(item=>{
    const matchFiltro=filtro==="todos"||item.tipo===filtro;
    const q=search.toLowerCase();
    const matchSearch=!q||[item.cliente,item.detalhe,item.tecnico].some(v=>(v||"").toLowerCase().includes(q));
    return matchFiltro&&matchSearch;
  });

  const counts={todos:allItems.length,laudo:allItems.filter(i=>i.tipo==="laudo").length,orcamento:allItems.filter(i=>i.tipo==="orcamento").length,agendamento:allItems.filter(i=>i.tipo==="agendamento").length};

  return <div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}}>
      {FILTROS.map(f=><div key={f.id} onClick={()=>setFiltro(f.id)}
        style={{background:filtro===f.id?C.orange:C.navyM,border:"1px solid "+(filtro===f.id?C.orange:C.border),borderRadius:10,padding:"14px 16px",cursor:"pointer",transition:"all 0.2s"}}>
        <div style={{fontSize:22,fontWeight:800,color:filtro===f.id?"#fff":(f.id==="todos"?C.text:tipoColor[f.id]||C.text)}}>{counts[f.id]||0}</div>
        <div style={{fontSize:12,color:filtro===f.id?"rgba(255,255,255,0.8)":C.muted,marginTop:2}}>{f.label}</div>
      </div>)}
    </div>
    <div style={{marginBottom:14}}><input placeholder="Buscar por cliente, detalhe ou técnico…" value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,maxWidth:420}}/></div>
    <div style={{...row,marginBottom:14,flexWrap:"wrap",gap:6}}>
      {FILTROS.map(f=><button key={f.id} onClick={()=>setFiltro(f.id)} style={{...btn(filtro===f.id?"primary":"ghost"),padding:"6px 14px",fontSize:12}}>
        {f.id!=="todos"&&<span style={{marginRight:4}}>{tipoIcon[f.id]}</span>}{f.label}
      </button>)}
    </div>
    {filtered.length===0
      ?<div style={{...card,textAlign:"center",padding:48,color:"#3a5880"}}>Nenhum registro encontrado.</div>
      :<div style={{display:"flex",flexDirection:"column",gap:6}}>
          {filtered.map(item=>{
            const dateStr=item.data?new Date(item.data+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"2-digit"}):"—";
            return <div key={item.tipo+item.id} style={{background:C.navyM,border:"1px solid "+C.border,borderRadius:8,padding:"10px 16px",display:"flex",alignItems:"center",gap:12,borderLeft:"3px solid "+(tipoColor[item.tipo]||C.border)}}>
              <span style={{fontSize:16,flexShrink:0}}>{tipoIcon[item.tipo]}</span>
              <span style={{fontSize:11,fontWeight:700,color:tipoColor[item.tipo]||C.muted,minWidth:80,flexShrink:0}}>{tipoLabel[item.tipo]}</span>
              <span style={{fontWeight:700,fontSize:13,flex:"0 0 180px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:180}}>{item.cliente}</span>
              <span style={{fontSize:12,color:C.muted,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.detalhe}</span>
              {item.tecnico&&<span style={{fontSize:11,color:C.blueL,flexShrink:0,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>👷 {item.tecnico}</span>}
              <span style={{fontSize:11,color:C.muted,flexShrink:0,minWidth:72,textAlign:"right"}}>{dateStr}</span>
              <div style={{flexShrink:0}}><StatusPill status={item.status}/></div>
            </div>;
          })}
        </div>}
  </div>;
}
